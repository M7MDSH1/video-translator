name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: choco install ffmpeg -y --no-progress
      - name: Make the sample video the tests open (the real one is not in the repository)
        shell: bash
        run: |
          mkdir -p tests/fixtures
          ffmpeg -v error -y -f lavfi -i testsrc2=s=1920x1080:r=30:d=20 -f lavfi -i sine=frequency=440:duration=20 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac tests/fixtures/test_excerpt.mp4
      - run: python -m unittest discover -s tests
        env:
          QT_QPA_PLATFORM: offscreen
